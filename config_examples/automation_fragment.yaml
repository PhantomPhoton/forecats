- id: "<YOUR AUTOMATION ID>"
  alias: generate forecats
  description: Forecats generation via the forecats.generate_pet_picture action
  triggers:
    - trigger: time
      at: "05:00:00"
  conditions: []
  actions:
    - action: forecats.generate_pet_picture
      data:
        config_entry_id: "<FORECATS CONFIG ENTRY ID>"
        weather_entity: weather.forecast_home
        location: "<YOUR LOCATION>"
        pets:
          - name: "<PET 1>"
            type: cat
            description: >
              <PET 1 DESCRIPTION>
          - name: "<PET 2>"
            type: dog
            description: >
              <PET 2 DESCRIPTION>
        # Prefer the Media Browser picker in the UI. YAML equivalent:
        input_image_dir:
          - media_content_id: media-source://media_source/local/forecats
            media_content_type: ""
        art_styles:
          - name: comic book
          - name: anime
          - name: pixar
          - name: watercolor
          - name: ghibli
          - name: disney
        final_image_size: "800x480"
        output_dir: /config/www/daily_forecats
        display_profile: spectra6
  mode: single
