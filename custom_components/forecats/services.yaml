generate_pet_picture:
  name: Generate Pet Picture
  description: >
    Generate a weather-themed pet picture using a configured Forecats instance.
    Fetches today's daily forecast from weather_entity.
  fields:
    config_entry_id:
      name: Forecats instance
      description: Which Forecats config entry to use.
      required: true
      selector:
        config_entry:
          integration: forecats
    weather_entity:
      name: Weather entity
      description: >
        Weather entity used for today's daily forecast and temperature unit
        (e.g. weather.forecast_home).
      required: true
      selector:
        entity:
          domain: weather
    location:
      name: Location
      description: Location label for weather context (e.g. "Toronto, Ontario, Canada")
      example: "Toronto, Ontario, Canada"
      required: true
      selector:
        text:
    pets:
      name: Pets
      description: >
        Pets to feature. Each needs a name and description; type defaults to cat.
      required: true
      selector:
        object:
          label_field: name
          description_field: type
          multiple: true
          fields:
            name:
              label: Name
              required: true
              selector:
                text:
            type:
              label: Type
              selector:
                text:
            description:
              label: Description
              required: true
              selector:
                text:
                  multiline: true
    input_image_dir:
      name: Input images
      description: >
        Pet reference images from the Media Browser (jpg/png/webp). Prefer a
        folder (Local Media → forecats) so every image inside is used; or pick
        a single file. The media UI cannot multi-select files yet — for several
        explicit paths, use YAML. Leave empty to generate without references.
      required: true
      default: []
      selector:
        media:
          accept:
            - image/*
            - directory
          multiple: true
    art_styles:
      name: Art styles
      description: Styles to randomly choose from each run.
      required: true
      default:
        - name: comic book
        - name: anime
        - name: pixar
        - name: watercolor
        - name: ghibli
        - name: disney
      selector:
        object:
          label_field: name
          multiple: true
          fields:
            name:
              label: Style
              required: true
              selector:
                text:
    final_image_size:
      name: Final image size
      description: >
        Output crop/resize for your display. Pick a common size or type a
        custom WIDTHxHEIGHT. Generation aspect/resolution/steps are set on
        the Forecats instance config.
      default: "800x480"
      example: "800x480"
      required: true
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - label: "800×480 (7.5\" e-ink)"
              value: "800x480"
            - label: "960×640"
              value: "960x640"
            - label: "1200×825"
              value: "1200x825"
            - label: "1600×1200"
              value: "1600x1200"
            - label: "1024×768"
              value: "1024x768"
            - label: "640×384"
              value: "640x384"
            - label: "480×800 (portrait)"
              value: "480x800"
    output_dir:
      name: Output directory
      description: >
        Folder for forecats_original.png and forecats_optimized.png.
        Use a path under `/config/www/` to serve via `/local/...`
        (default `/config/www/daily_forecats`).
      required: true
      default: "/config/www/daily_forecats"
      example: "/config/www/daily_forecats"
      selector:
        text:
    display_profile:
      name: Display profile
      description: Color profile for your display.
      required: true
      default: ""
      selector:
        select:
          mode: dropdown
          options:
            - label: "None (original colors)"
              value: ""
            - label: "Spectra 6 (e-ink)"
              value: "spectra6"
